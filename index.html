<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>cieloenhmo</title>
</head>
<body>
  <h1>cieloenhmo</h1>
  <p>Reporte del cielo y clima de Hermosillo.</p>

  <div id="clima">Cargando datos del clima...</div>

  <script>
    function formatHora(iso) {
      var fecha = new Date(iso);
      return fecha.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit", hour12: true });
    }

    function formatFechaHora(iso) {
      var fecha = new Date(iso);
      return fecha.toLocaleString("es-MX", { day: "numeric", month: "long", hour: "numeric", minute: "2-digit", hour12: true });
    }

    fetch("data.json")
      .then(function (respuesta) {
        return respuesta.json();
      })
      .then(function (datos) {
        document.getElementById("clima").innerHTML =
          "Temperatura: " + datos.temperatura + "°C<br>" +
          "Sensación: " + datos.sensacion + "°C<br>" +
          "Humedad: " + datos.humedad + "%<br>" +
          "Viento: " + datos.viento + " km/h<br>" +
          "Amanecer: " + formatHora(datos.amanecer) + "<br>" +
          "Atardecer: " + formatHora(datos.atardecer) + "<br>" +
          "Actualizado: " + formatFechaHora(datos.actualizado);
      });
  </script>
</body>
</html>
