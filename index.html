<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>cieloenhmo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a2a4a 0%, #3a5a8a 100%);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1a1a1a;
    }

    .tarjeta {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      width: 320px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    .tarjeta h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
    }

    .tarjeta p.subtitulo {
      margin: 0 0 20px 0;
      color: #666;
      font-size: 14px;
    }

    .temp-principal {
      font-size: 56px;
      font-weight: 600;
      margin: 0;
      line-height: 1;
    }

    .sensacion {
      color: #666;
      font-size: 14px;
      margin: 6px 0 24px 0;
    }

    .detalles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      text-align: left;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .detalle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .detalle .icono {
      font-size: 20px;
    }

    .actualizado {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>cieloenhmo</h1>
    <p class="subtitulo">Hermosillo, Sonora</p>

    <div id="clima">Cargando...</div>
  </div>

  <script>
    function formatHora(iso) {
      var fecha = new Date(iso);
      return fecha.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit", hour12: true });
    }

    function formatFechaHora(iso) {
      var fecha = new Date(iso);
      return fecha.toLocaleString("es-MX", { day: "numeric", month: "long", hour: "numeric", minute: "2-digit", hour12: true });
    }

    fetch("data.json")
      .then(function (respuesta) {
        return respuesta.json();
      })
      .then(function (datos) {
        document.getElementById("clima").innerHTML =
          '<p class="temp-principal">' + Math.round(datos.temperatura) + '°C</p>' +
          '<p class="sensacion">Sensación ' + Math.round(datos.sensacion) + '°C</p>' +
          '<div class="detalles">' +
            '<div class="detalle"><span class="icono">💧</span>' + datos.humedad + '%</div>' +
            '<div class="detalle"><span class="icono">💨</span>' + datos.viento + ' km/h</div>' +
            '<div class="detalle"><span class="icono">🌅</span>' + formatHora(datos.amanecer) + '</div>' +
            '<div class="detalle"><span class="icono">🌇</span>' + formatHora(datos.atardecer) + '</div>' +
          '</div>' +
          '<p class="actualizado">Actualizado ' + formatFechaHora(datos.actualizado) + '</p>';
      });
  </script>
</body>
</html>
